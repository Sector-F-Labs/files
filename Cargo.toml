[package]
name = "files"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "A Patina file manager, where a Name.app folder is an app you open"

[dependencies]
blocking = "1"
dirs = "7"
eframe = { version = "0.35", features = ["persistence"] }
egui = "0.35"
freedesktop-icons = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
libc = "0.2"
notify = "7"
patina-apps = { git = "https://github.com/Sector-F-Labs/patina-apps", features = ["icon"] }
patina-ui = "0.1.9"
serde = { version = "1", features = ["derive"] }
toml = "1"
trash = "5.2.9"
zbus = "5"
